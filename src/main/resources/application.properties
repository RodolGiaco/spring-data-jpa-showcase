spring.application.name=rodo-pizzeria

# Datasource: values come from environment variables (see .env.example),
# falling back to the local development defaults after the colon.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pizzeria?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:pizzeria_user}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
